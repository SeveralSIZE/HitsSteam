services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: hitssteam
      POSTGRES_USER: hitssteam
      POSTGRES_PASSWORD: hitssteam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hitssteam"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  pgdata: